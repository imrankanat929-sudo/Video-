/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

  let s = k * 99991 + 7; for (let i = 0; i < id.data.length; i += 4) { s = (s * 16807) % 2147483647; const vv = (s % 256); id.data[i] = id.data[i + 1] = id.data[i + 2] = vv; id.data[i + 3] = 255; }

/* ---------- particle clock (slows to 0 when time "freezes") ---------- */
function speedAt(t) {
  let s = 1;
  if (t > 60.45 && t < 62.2) s = 1 - seg(t, 60.45, 60.75);         // freeze
  else if (t >= 62.2 && t < 82.4) s = .25;                            // slow thinking: slow world
  if (t > v(91.1) && t < v(93.0)) s = Math.min(s, 1 - seg(t, v(91.1), v(91.5)));  // "остановись"
  return s;
}
const PCLK = []; { let acc = 0; for (let i = 0; i <= END * 60 + 60; i++) { PCLK.push(acc); acc += speedAt(i / 60) / 60; } }
const pclock = t => PCLK[Math.max(0, Math.min(PCLK.length - 1, Math.round(t * 60)))];

/* ---------- drawing primitives ---------- */
function setStroke(ctx, w = 4, a = 1) { ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }

const FONT = 'Inter';
function spacedWidth(ctx, s, sp) { let w = 0; for (const ch of s) w += ctx.measureText(ch).width + sp; return w - sp; }
const GLYPHS = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ0123456789#$%/<>?';
/* text: reveal (0..1) types characters in; glitch>0 shows scrambled glyphs before they resolve */
function txt(ctx, s, x, y, o = {}) {
  const size = o.size || 40, weight = o.weight || 500, sp = o.sp ?? size * .12, alpha = o.alpha ?? 1;
  if (alpha <= 0.002) return;

  ctx.save();

  const chars = [...s]; const n = chars.length;

  for (let i = 0; i < n; i++) {
    const ch = chars[i], cw = ctx.measureText(ch).width;
    const k = clamp(reveal * (n + 4) - i, 0, 4) / 4;           // per-char progress
    if (k > 0 && ch !== ' ') {
      let g = ch;
      if (glitch > 0 && k < 1) g = GLYPHS[Math.floor(hash(i * 13 + Math.floor(t * 24)) * GLYPHS.length)];
      ctx.globalAlpha = alpha * (glitch > 0 ? (k < 1 ? .55 : 1) : eOut(k));
      ctx.fillStyle = o.color || '#fff';
      const dy = glitch > 0 ? 0 : (1 - eOut(k)) * size * .35;
      ctx.fillText(g, cx, y + dy);
    }
    cx += cw + sp;
  }
  ctx.restore();
  return w;
}
/* pill label like the reference ("ЗНАЕТ ВСЁ") */
function pill(ctx, s, x, y, o = {}) {
  const size = o.size || 26, a = o.alpha ?? 1; if (a <= 0.002) return;
  const sc = o.scale ?? 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.font = `${o.weight || 600} ${size}px ${FONT}`;
  const sp = size * .14; const w = spacedWidth(ctx, s, sp); const ph = size * 2.05;
  const pw = ph + (w + size * 1.6 - ph) * eOut(Math.min(1, (o.reveal ?? 1) * 1.5));
  ctx.globalAlpha = a;
  if (o.outline) { setStroke(ctx, 3, 1); rrect(ctx, -pw / 2, -ph / 2, pw, ph, ph / 2); ctx.stroke(); }
  else { ctx.fillStyle = '#f4f4f4'; rrect(ctx, -pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  txt(ctx, s, 0, 1, { size, weight: o.weight || 600, sp, alpha: a, color: o.outline ? '#fff' : '#1a1a1a', reveal: o.reveal ?? 1, glitch: o.glitch, t: o.t });
  ctx.restore();
}

/* ---------- the stickman ---------- */
/* o: x, y (feet), s, dir (1 right / -1 left), walk (phase rad), armF/armB [shoulder, elbow] (0 = down,
   +  = toward facing direction), head [dx,dy], lean, alpha, hollow (0..1 outline-only), squash */
function personShapes(ctx, o, inset) {
  const ph = o.walk;
  const walking = ph !== undefined && ph !== null;
  const wa = walking ? (o.walkAmt ?? 1) : 0;
  const sw = walking ? Math.sin(ph) : 0;
  const bob = walking ? -Math.abs(Math.cos(ph)) * 7 * wa : 0;
  const legA = .42 * sw * wa, legB = -.42 * sw * wa;
  const sq = o.squash || 0;
  const lw = 24 - inset * 2, aw = 21 - inset * 2;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  // legs
  const hipY = -96 + bob * .3 - sq * 10;
  const legs = [[-17, o.legB ?? legB], [17, o.legF ?? legA]];
  ctx.lineWidth = lw;
  for (const [hx, a] of legs) {
    const kx = hx + Math.sin(a) * 50, ky = hipY + Math.cos(a) * 50;
    const bend = walking ? Math.max(0, -Math.cos(ph + (hx > 0 ? 0 : Math.PI))) * .5 * wa : 0;
    const fx = kx + Math.sin(a - bend) * 46, fy = Math.min(0, ky + Math.cos(a - bend) * 46);
    ctx.beginPath(); ctx.moveTo(hx, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
  }

  ctx.save();
  ctx.translate(0, hipY); ctx.rotate(o.lean || 0); ctx.translate(0, -hipY + bob);
  ctx.scale(1 + sq * .12, 1 - sq * .1);
  const tx = -44 + inset, tw = 88 - inset * 2, ty = -218 + inset, th = 124 - inset * 2;
  rrect(ctx, tx, ty, tw, th, [40 - inset, 40 - inset, 10, 10]); ctx.fill();
  // arms
  ctx.lineWidth = aw;
  const armB = o.armB || [-.16 - .35 * sw * wa, -.15], armF = o.armF || [.16 + .35 * sw * wa, .15];
  for (const [sx, arm] of [[-26, armB], [26, armF]]) {
    const sy = -192;
    const ex = sx + Math.sin(arm[0]) * 56, ey = sy + Math.cos(arm[0]) * 56;
    const hx = ex + Math.sin(arm[0] + arm[1]) * 50, hy = ey + Math.cos(arm[0] + arm[1]) * 50;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  }

  const hd = o.head || [0, 0];
  circle(ctx, hd[0], -266 + hd[1], 37 - inset); ctx.fill();
  ctx.restore();
}
function person(ctx, o) {
  const a = o.alpha ?? 1, hollow = o.hollow || 0;
  if (a <= 0.002) return;
  const direct = a > .999 && hollow < .001;
  const tgt = direct ? ctx : PX;
  const m = ctx.getTransform();
  if (!direct) { PX.setTransform(1, 0, 0, 1, 0, 0); PX.clearRect(0, 0, W, H); PX.setTransform(m); }
  tgt.save();
  tgt.translate(o.x, o.y); tgt.scale((o.s || 1) * (o.dir || 1), o.s || 1);
  tgt.globalCompositeOperation = 'source-over'; tgt.globalAlpha = 1;
  personShapes(tgt, o, 0);

  tgt.restore();

}

/* ---------- brain (2D, side view) ---------- */
const BRAIN_C = [[-.62, -.05, .46], [-.25, -.36, .5], [.2, -.4, .5], [.6, -.12, .44], [.52, .22, .36], [.08, .12, .5], [-.4, .24, .4], [-.8, .12, .3], [-.1, -.1, .5]];
const BRAIN_SC = 300;
const BRAIN = mk(900, 700);
{ const g = BRAIN.getContext('2d'); g.translate(450, 330);
  g.fillStyle = '#fff'; for (const [x, y, r] of BRAIN_C) { circle(g, x * BRAIN_SC, y * BRAIN_SC, r * BRAIN_SC); g.fill(); }
  // cerebellum + stem
  circle(g, -.55 * BRAIN_SC, .5 * BRAIN_SC, .2 * BRAIN_SC); g.fill();
  rrect(g, -.2 * BRAIN_SC, .3 * BRAIN_SC, .2 * BRAIN_SC, .48 * BRAIN_SC, 24); g.fill();

  const k = 6;
  for (const [x, y, r] of BRAIN_C) { circle(g, x * BRAIN_SC, y * BRAIN_SC, r * BRAIN_SC - k); g.fill(); }
  circle(g, -.55 * BRAIN_SC, .5 * BRAIN_SC, .2 * BRAIN_SC - k); g.fill();
  rrect(g, -.2 * BRAIN_SC + k, .3 * BRAIN_SC + k, .2 * BRAIN_SC - 2 * k, .48 * BRAIN_SC - 2 * k, 20); g.fill();

/* SCENE 3b — the first impression (reference composition), freezes at 60.45 */
const FREEZE = 60.45;
function sImpression(ctx, tReal) {
  const t = Math.min(tReal, FREEZE);
  const s = lerp(1.08, 1.0, eOut(seg(t, 48.2, 50.5))) + seg(t, v(53.6), FREEZE) * .05;
  cam(ctx, 960, lerp(560, 540, seg(t, 48.2, 51)), s, 0, ...shake(t, v(53.58), 10, .4));
  const reveal = seg(t, v(53.58), v(54.2));      // "хотя на самом деле..."
  // chart board
  const bx = 600, by = 300, bw = 520, bh = 340;
  const ba = seg(t, 48.4, 49.0);
  ctx.save(); ctx.globalAlpha = ba; setStroke(ctx, 4, 1); ctx.fillStyle = '#050505';
  rrect(ctx, bx, by, bw, bh, 16); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = ba * .8; setStroke(ctx, 2.5, 1);
  line(ctx, bx + 55, by + 55, bx + 55, by + bh - 45); line(ctx, bx + 55, by + bh - 45, bx + bw - 50, by + bh - 45);
  // curve
  const ck = eIO(seg(t, v(47.4), v(48.9)));
  const flick = reveal > 0 ? (1 - reveal * .85) * (hash(Math.floor(tReal * 20)) > .3 ? 1 : .3) : 1;
  const cp = k => [bx + 55 + k * (bw - 120), by + bh - 45 - Math.pow(k, 2.2) * (bh - 120)];
  if (ck > 0) {
    ctx.globalAlpha = ba * flick; setStroke(ctx, 4, 1); ctx.beginPath();
    for (let i = 0; i <= 60 * ck; i++) { const [x, y] = cp(i / 60); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
    const [ex, ey] = cp(ck); glowDot(ctx, ex, ey, 60, .9 * flick); ctx.fillStyle = '#fff'; circle(ctx, ex, ey, 7); ctx.fill();
    [.3, .58, .85].forEach((k, i) => { const c = seg(t, v(47.6) + i * .35, v(47.9) + i * .35); if (c <= 0) return;
      const [x, y] = cp(k); ctx.save(); ctx.globalAlpha = ba * flick; ctx.translate(x - 20, y - 26); ctx.scale(eBack(c), eBack(c));
      ctx.fillStyle = '#fff'; circle(ctx, 0, 0, 20); ctx.fill(); ctx.fillStyle = '#111'; ctx.font = `700 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1); ctx.restore(); });
  }
  ctx.restore();
  // "knows everything" pill — appears as the impression forms; gains a "?" on the reveal
  const kp = seg(t, v(50.9), v(51.3));
  pill(ctx, reveal > .3 ? T.knows + '?' : T.knows, bx + bw / 2, by - 70, { size: 24, alpha: kp, scale: eBack(kp) * (1 + .08 * pulse(tReal, v(53.7), .5)), glitch: reveal > 0 && reveal < 1 ? 1 : 0, t: tReal, reveal: 1 });
  // presenter (confident): enters left, chest out, then points
  const pe = seg(t, v(44.84), v(45.7));
  const point = eOut(seg(t, v(47.1), v(47.6)));
  const prx = 330;
  spotlight(ctx, prx, -40, 850, 460, pe * (1 - reveal * .7));
  const ang = aimAngle((bx + 40) - (prx + 26 * 1.08), (by + 200) - (850 - 192 * 1.08));
  person(ctx, { x: prx, y: 850, s: 1.08, alpha: pe, lean: -.06 * pe,
    armF: [lerp(.5, ang, point), lerp(-1.9, 0, point)], armB: [-.5, 1.9], hollow: eIO(reveal) * .95 });
  // main character (viewer): right side, facing left

  const mx = 1480;

  // thought bubble: ? -> ! -> ?

    alpha: seg(t, 68.2, 68.8) });

        ctx.fillStyle = '#050505'; rrect(ctx, -80, 90, 160, 110, 12); ctx.fill(); ctx.stroke();

        ctx.globalAlpha = st2; ctx.restore(); }
    ctx.restore(); ctx.fillStyle = '#fff'; circle(ctx, cx, cy, 9); ctx.fill(); ctx.restore();
  }
  // stage 3: questions — checklist that ticks slowly
  const st3 = seg(t, v(68.3), v(68.9)) * (1 - seg(t, v(76.6), v(77.6)) * .75);

/* SCENE 5 — two paths */
function sFork(ctx, t) {
  const s = lerp(1.3, 1.0, eIO(seg(t, 82.4, 86.5)));
  const cy = lerp(700, 540, eIO(seg(t, 82.4, 86.5)));
  const fin = eIO(seg(t, v(92.9), v(95.8)));
  cam(ctx, 960, lerp(cy, 520, fin), s * (1 + fin * .06), 0);
  const hz = 430, fkx = 960, fky = 880;
  const vL = [520, hz], vR = [1400, hz];
  const pF = clamp(pclock(t) - pclock(82.4));
  const hiR = env(t, v(82.9), v(84.4), .3, .5), hiL = env(t, v(85.2), v(86.9), .3, .5);
  const stop = seg(t, v(91.1), v(91.5));
  const dim = 1 - stop * .55;
  // horizon line
  ctx.save(); setStroke(ctx, 2, .25 * dim); line(ctx, 0, hz, W, hz); ctx.restore();
  // path edges: from fork outwards to vanishing points
  const path = (vp, w0, a) => {
    ctx.save(); setStroke(ctx, 3.5, a);
    line(ctx, fkx - w0, fky + 200, vp[0] - 14, vp[1]); line(ctx, fkx + w0, fky + 200, vp[0] + 14, vp[1]); ctx.restore();
  };
  path(vL, 150, (.45 + .45 * hiL) * dim);
  path(vR, 150, (.45 + .45 * hiR) * dim);
  // FAST path: light streaks rushing toward the horizon
  const pc = pclock(t);
  ctx.save(); ctx.fillStyle = '#fff';
  for (let i = 0; i < 26; i++) {
    const k = (pc * 1.1 + hash(i)) % 1; const kk = Math.pow(k, 1.6);
    const off = (hash(i + 7) - .5) * 120 * (1 - kk);
    const x = lerp(fkx + off, vL[0], kk), y = lerp(fky + 120, vL[1], kk);
    ctx.globalAlpha = (1 - kk) * .9 * (.6 + .4 * hiL) * dim;
    const len = 46 * (1 - kk) + 6;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(vL[1] - (fky + 120), vL[0] - fkx));
    rrect(ctx, -len, -2.5, len, 5, 2.5); ctx.fill(); ctx.restore();
  }
  ctx.restore();
  // CAREFUL path: stepping stones appearing one by one
  for (let i = 0; i < 8; i++) {
    const k = i / 8; const kk = 1 - Math.pow(1 - k, 1.2);
    const ap = seg(t, 83.0 + i * .35, 83.5 + i * .35);
    const x = lerp(fkx + 40, vR[0], kk * .96), y = lerp(fky + 60, vR[1], kk * .96);
    const sz = 70 * (1 - kk * .85);
    ctx.save(); ctx.globalAlpha = ap * (.55 + .45 * hiR) * dim * (.6 + .4 * Math.sin(t * 1.2 - i * .6) ** 2); setStroke(ctx, 3, 1);
    ctx.translate(x, y); ctx.scale(1, .45); rrect(ctx, -sz, -sz * .5, sz * 2, sz, sz * .25); ctx.stroke(); ctx.restore();
  }
  // icons at the ends
  ctx.save(); setStroke(ctx, 4, (.6 + .4 * hiL) * dim); ctx.translate(vL[0], vL[1] - 70); iconBolt(ctx, 1.3); ctx.restore();
  ctx.save(); setStroke(ctx, 4, (.6 + .4 * hiR) * dim); ctx.translate(vR[0] - 10, vR[1] - 80); iconMagnifier(ctx, 22); ctx.restore();
  glowDot(ctx, vL[0], vL[1], 220, (.35 + .4 * hiL) * dim);
  glowDot(ctx, vR[0], vR[1], 220, (.25 + .4 * hiR) * dim);
  // character at the fork (seen from behind)
  const look = hiR > hiL ? hiR : -hiL;
  const hold = stop;
  person(ctx, { x: fkx, y: fky, s: .9, head: [look * 10, 0], armF: [.12, .1], armB: [-.12, -.1], lean: look * .04,
    alpha: seg(t, 82.4, 83.2) });
  // "stop for a second": slow ring around him
  if (hold > 0) {
    for (let i = 0; i < 2; i++) { const k = ((t - v(91.18)) * .35 + i * .5) % 1; if (t < v(91.18)) continue;
      ctx.save(); setStroke(ctx, 2.5, (1 - k) * .7 * (1 - fin * .7)); ctx.translate(fkx, fky - 130); ctx.scale(1, .9); circle(ctx, 0, 0, 120 + k * 360); ctx.stroke(); ctx.restore(); }
    glowDot(ctx, fkx, fky - 240, 200, .35 * hold);
  }
  screen(ctx);
  // labels in screen space near the horizon ends
  // draw labels in world (then screen) — reuse camera
  cam(ctx, 960, lerp(cy, 520, fin), s * (1 + fin * .06), 0);
  pill(ctx, T.pathFast, vL[0], vL[1] - 160, { size: 24, alpha: seg(t, 83.6, 84.2) * dim * (1 - seg(t, v(92.6), v(93.4))), outline: hiL < .5, scale: 1 + .08 * hiL, reveal: seg(t, 83.6, 84.6) });
  pill(ctx, T.pathSlow, vR[0], vR[1] - 160, { size: 24, alpha: seg(t, 84.0, 84.6) * dim * (1 - seg(t, v(92.6), v(93.4))), outline: hiR < .5, scale: 1 + .08 * hiR, reveal: seg(t, 84.0, 84.8) });
  screen(ctx);
  txt(ctx, T.stop, 960, 140, { size: 32, weight: 400, sp: 10, alpha: env(t, v(91.2), v(93.3), .4, .5) * .85, reveal: seg(t, v(91.2), v(92.2)) });
  const th = seg(t, v(93.4), v(94.9));
  txt(ctx, T.think, 960, 170, { size: 96, weight: 700, sp: 14, alpha: env(t, v(93.4), 100.9, .3, .8), reveal: th });
}

/* END — logo */
function sLogo(ctx, t) {
  screen(ctx);
  const a = env(t, 101.1, 104.4, .8, 1.2);
  const k = eOut(seg(t, 101.0, 102.6));
  // small brain mark
  ctx.save(); ctx.globalAlpha = a * .9; brain2D(ctx, 960, 430, .32, t, { act: .4, speed: .6, alpha: a }); ctx.restore();
  txt(ctx, 'HUMAN MIND', 960, 590, { size: 92, weight: 300, sp: lerp(60, 30, k), alpha: a });
  ctx.save(); setStroke(ctx, 2, a * .7); line(ctx, 960 - 260 * k, 665, 960 + 260 * k, 665); ctx.restore();
  txt(ctx, T.ep, 960, 710, { size: 22, weight: 500, sp: 10, alpha: a * .7 * seg(t, 101.6, 102.4) });
}

/* ---------- scene table ---------- */
const SCENES = [
  { a: 0, b: DROP, fi: 0, fo: 0, f: sHook },
  { a: DROP, b: v(24.4), fi: 0, fo: .5, f: sRoom },
  { a: v(23.9), b: v(28.6), fi: .5, fo: .5, f: (c, t) => sBrainFast(c, t, 1) },
  { a: v(28.1), b: v(36.3), fi: .5, fo: .5, f: sStreet },
  { a: v(35.8), b: 44.6, fi: .5, fo: .5, f: (c, t) => sBrainFast(c, t, 2) },
  { a: 44.1, b: 48.9, fi: .5, fo: .6, f: sHasty },
  { a: 48.3, b: 62.6, fi: .6, fo: .8, f: sImpression },
  { a: 61.8, b: 68.9, fi: .8, fo: .7, f: sBrain3D },
  { a: 68.2, b: 82.9, fi: .7, fo: .6, f: sAnalysis },
  { a: 82.3, b: 101.2, fi: .6, fo: 1.0, f: sFork },
  { a: 100.9, b: END, fi: .1, fo: .1, f: sLogo },
];
window.SCENES = SCENES;

/* ---------- frame ---------- */
function frame(t) {
  // background
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.fillStyle = '#030303'; X.fillRect(0, 0, W, H);
  const bg = X.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, 1000);
  bg.addColorStop(0, '#161616'); bg.addColorStop(1, '#030303'); X.fillStyle = bg; X.fillRect(0, 0, W, H);
  const pc = pclock(t);
  const gridA = t < DROP ? seg(t, .3, 2.5) * .6 : 1;
  X.globalAlpha = gridA; X.drawImage(GRID, -((pc * 6) % 40) - 20, -((pc * 3) % 40) - 20); X.globalAlpha = 1;
  // dust
  X.fillStyle = '#fff';
  for (let i = 0; i < 70; i++) {
    const x = ((hash(i) * (W + 200) + pc * (8 + hash(i + 3) * 18)) % (W + 200)) - 100;
    const y = ((hash(i + 1) * (H + 200) - pc * (5 + hash(i + 5) * 10)) % (H + 200) + H + 200) % (H + 200) - 100;
    X.globalAlpha = (.12 + .35 * hash(i + 2)) * (.6 + .4 * Math.sin(pc * 1.5 + i));
    circle(X, x, y, .8 + 1.8 * hash(i + 4)); X.fill();
  }
  X.globalAlpha = 1;

  // scenes into L
  LX.setTransform(1, 0, 0, 1, 0, 0); LX.clearRect(0, 0, W, H);
  let glitch = 0;
  const active = SCENES.map(sc => ({ sc, a: env(t, sc.a, sc.b, sc.fi, sc.fo) })).filter(o => o.a > 0.001);
  for (const { sc, a } of active) {
    if (a > .999 && active.length === 1) {
      LX.save(); const g = sc.f(LX, t); if (typeof g === 'number') glitch = Math.max(glitch, g); LX.restore();
    } else {
      const lay = S1, lx = lay.getContext('2d');
      lx.setTransform(1, 0, 0, 1, 0, 0); lx.globalAlpha = 1; lx.clearRect(0, 0, W, H);
      lx.save(); const g = sc.f(lx, t); if (typeof g === 'number') glitch = Math.max(glitch, g * a); lx.restore();
      LX.setTransform(1, 0, 0, 1, 0, 0); LX.globalAlpha = a; LX.drawImage(lay, 0, 0); LX.globalAlpha = 1;
    }
  }
  // freeze: desaturate/dim world a little
  // bloom
  G1X.clearRect(0, 0, GW, GH); G1X.drawImage(L, 0, 0, GW, GH);
  G2X.clearRect(0, 0, GW, GH); G2X.filter = 'blur(3px)'; G2X.drawImage(G1, 0, 0); G2X.filter = 'none';
  G3X.clearRect(0, 0, GW / 2, GH / 2); G3X.drawImage(G1, 0, 0, GW / 2, GH / 2);
  G4X.clearRect(0, 0, GW / 2, GH / 2); G4X.filter = 'blur(5px)'; G4X.drawImage(G3, 0, 0); G4X.filter = 'none';
  X.globalCompositeOperation = 'lighter';
  X.globalAlpha = .55; X.drawImage(G4, 0, 0, W, H);
  X.globalAlpha = .85; X.drawImage(G2, 0, 0, W, H);
  X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.drawImage(L, 0, 0);

  // glitch: horizontal slices
  const gl = Math.max(glitch, pulse(t, 0.15, .25), pulse(t, v(53.58), .35) * .8, pulse(t, FREEZE, .3) * .6);
  if (gl > .02) {
    TX.setTransform(1, 0, 0, 1, 0, 0); TX.clearRect(0, 0, W, H); TX.drawImage(C, 0, 0);
    const fr = Math.floor(t * 30);
    for (let i = 0; i < 9; i++) {
      if (hash(fr * 7 + i) > gl * 1.1) continue;
      const y = Math.floor(hash(fr * 3 + i * 11) * H), h = 6 + hash(fr + i * 5) * 70, dx = (hash(fr * 13 + i) - .5) * 160 * gl;
      X.drawImage(TMP, 0, y, W, h, dx, y, W, h);
    }
  }
  if (VERT) {
    const TT = LANG === 'ru' ? ['ТВОЙ МОЗГ', 'РЕШАЕТ', 'ЗА ТЕБЯ'] : ['YOUR BRAIN', 'DECIDES', 'FOR YOU'];
    X.save(); X.shadowColor = 'rgba(255,255,255,.55)'; X.shadowBlur = 40;
    txt(X, TT[0], W / 2, 250, { size: 128, weight: 800, sp: 4 });
    txt(X, TT[1], W / 2, 400, { size: 128, weight: 800, sp: 4 });
    txt(X, TT[2], W / 2, 550, { size: 128, weight: 300, sp: 6 });
    X.restore();
    pill(X, LANG === 'ru' ? 'БЫСТРОЕ VS МЕДЛЕННОЕ МЫШЛЕНИЕ' : 'FAST VS SLOW THINKING', W / 2, 1690, { size: 30 });
    txt(X, 'HUMAN MIND · 01', W / 2, 1800, { size: 30, weight: 500, sp: 12, alpha: .7 });
  } else if (THUMB) {
    const TT = LANG === 'ru' ? ['ТВОЙ МОЗГ', 'РЕШАЕТ', 'ЗА ТЕБЯ'] : ['YOUR BRAIN', 'DECIDES', 'FOR YOU'];
    X.save(); X.shadowColor = 'rgba(255,255,255,.55)'; X.shadowBlur = 40;
    txt(X, TT[0], 1010, 330, { size: 122, weight: 800, sp: 6, align: 'left' });
    txt(X, TT[1], 1010, 475, { size: 122, weight: 800, sp: 6, align: 'left' });
    txt(X, TT[2], 1010, 620, { size: 122, weight: 300, sp: 6, align: 'left' });
    X.restore();
    pill(X, LANG === 'ru' ? 'БЫСТРОЕ VS МЕДЛЕННОЕ МЫШЛЕНИЕ' : 'FAST VS SLOW THINKING', 1330, 770, { size: 30 });
    txt(X, "HUMAN MIND · 01", 1015, 890, { size: 30, weight: 500, sp: 12, align: 'left', alpha: .7 });
  }
  // vignette + grain
  X.drawImage(VIG, 0, 0);
  X.globalCompositeOperation = 'overlay'; X.globalAlpha = .06;
  X.drawImage(GRAIN[Math.floor(t * 24) % GRAIN.length], 0, 0, W, H);
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  // flashes
  const flash = Math.max(t < DROP ? seg(t, 3.05, DROP) ** 3 : 0, pulse(t, DROP, .7) * .9, pulse(t, .15, .25) * .5, pulse(t, v(33.02), .3) * .45);
  if (flash > .003) { X.fillStyle = `rgba(255,255,255,${flash})`; X.fillRect(0, 0, W, H); }
  // fade from/to black
  const black = Math.max(1 - seg(t, 0, .12), seg(t, 103.9, END));
  if (black > .003) { X.fillStyle = `rgba(0,0,0,${black})`; X.fillRect(0, 0, W, H); }
}
window.frame = frame;
window.ready = document.fonts.load(`600 40px ${FONT}`).then(() => Promise.all([300, 400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px ${FONT}`)))).then(() => true);
</script></body></html>
